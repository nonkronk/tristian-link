name: Bootstrap Cloudflare Access admin gate

on:
  push:
    branches: [feat/serverless-worker]
    paths:
      - '.github/workflows/serverless-access-bootstrap.yml'

permissions:
  contents: read

jobs:
  access:
    runs-on: [self-hosted, Linux, ARM64, link]
    environment: CLOUDFLARE
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 54a91f1020fb773dad8aa0b3a70f93b4
    steps:
      - uses: actions/checkout@v7
      - name: Reconcile owner-only admin Access gate
        run: python3 scripts/reconcile-access.py
