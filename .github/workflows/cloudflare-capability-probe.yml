name: Cloudflare capability probe

on:
  push:
    branches: [feat/serverless-worker]
    paths:
      - '.github/workflows/cloudflare-capability-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, ARM64, link]
    environment: CLOUDFLARE
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: 54a91f1020fb773dad8aa0b3a70f93b4
    steps:
      - name: Probe Access readiness without exposing application metadata
        shell: bash
        run: |
          set -euo pipefail
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT

          apps_code=$(curl --silent --show-error -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/access/apps")
          if [[ "$apps_code" == 200 ]]; then
            python3 -c 'import json,sys; x=json.load(open(sys.argv[1],encoding="utf-8")); assert x.get("success") is True; rows=x.get("result") or []; print("ACCESS_APPS_READ=available count={} self_hosted={}".format(len(rows),sum(1 for r in rows if r.get("type")=="self_hosted")))' "$body"
          else
            echo "ACCESS_APPS_READ=not_authorized http=$apps_code"
          fi

          idp_code=$(curl --silent --show-error -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/access/identity_providers")
          if [[ "$idp_code" == 200 ]]; then
            python3 -c 'import json,sys; x=json.load(open(sys.argv[1],encoding="utf-8")); assert x.get("success") is True; rows=x.get("result") or []; types=sorted({str(r.get("type")) for r in rows}); print("ACCESS_IDP_READ=available count={} types={}".format(len(rows),",".join(types)))' "$body"
          else
            echo "ACCESS_IDP_READ=not_authorized http=$idp_code"
          fi

          policies_code=$(curl --silent --show-error -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/access/policies")
          case "$policies_code" in
            200) echo "ACCESS_POLICIES_READ=available" ;;
            401|403) echo "ACCESS_POLICIES_READ=not_authorized" ;;
            *) echo "ACCESS_POLICIES_READ=unexpected_http_$policies_code"; exit 1 ;;
          esac
