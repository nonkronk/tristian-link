name: Cloudflare capability probe

on:
  push:
    branches: [feat/serverless-worker]
    paths:
      - '.github/workflows/cloudflare-capability-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, ARM64, link]
    environment: CLOUDFLARE
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: 54a91f1020fb773dad8aa0b3a70f93b4
    steps:
      - name: Probe optional Zero Trust Access API
        shell: bash
        run: |
          set -euo pipefail
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          code=$(curl --silent --show-error -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/access/apps")
          case "$code" in
            200) echo "ZERO_TRUST_ACCESS_API=available" ;;
            401|403) echo "ZERO_TRUST_ACCESS_API=not_authorized" ;;
            *) echo "ZERO_TRUST_ACCESS_API=unexpected_http_$code"; exit 1 ;;
          esac
