name: Serverless migration inventory

on:
  push:
    branches: [feat/serverless-worker]
    paths:
      - '.github/workflows/serverless-inventory.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: [self-hosted, Linux, ARM64, link]
    timeout-minutes: 5
    steps:
      - name: Inspect live Kutt database shape
        shell: bash
        run: |
          set -euo pipefail
          docker inspect kutt_pg >/dev/null
          docker exec -i kutt_pg psql -X -v ON_ERROR_STOP=1 -U ritb -d ur_postgres -At <<'SQL'
          SELECT json_build_object(
            'tables', (
              SELECT json_agg(t.table_name ORDER BY t.table_name)
              FROM information_schema.tables t
              WHERE t.table_schema='public'
            ),
            'columns', (
              SELECT json_agg(json_build_object(
                'table',c.table_name,
                'name',c.column_name,
                'type',c.data_type,
                'nullable',c.is_nullable
              ) ORDER BY c.table_name,c.ordinal_position)
              FROM information_schema.columns c
              WHERE c.table_schema='public'
            )
          );
          SQL

      - name: Count live rows without exposing link targets
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i kutt_pg psql -X -v ON_ERROR_STOP=1 -U ritb -d ur_postgres -At <<'SQL'
          DO $$
          DECLARE r record;
          DECLARE n bigint;
          BEGIN
            FOR r IN
              SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename
            LOOP
              EXECUTE format('SELECT count(*) FROM %I', r.tablename) INTO n;
              RAISE NOTICE '%=%', r.tablename, n;
            END LOOP;
          END $$;
          SQL

      - name: Summarize migration-relevant Kutt state
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i kutt_pg psql -X -v ON_ERROR_STOP=1 -U ritb -d ur_postgres -At <<'SQL'
          SELECT json_build_object(
            'links_total', (SELECT count(*) FROM links),
            'links_custom_domain', (SELECT count(*) FROM links WHERE domain_id IS NOT NULL),
            'links_passworded', (SELECT count(*) FROM links WHERE password IS NOT NULL AND password <> ''),
            'links_expiring', (SELECT count(*) FROM links WHERE expire_in IS NOT NULL),
            'users_total', (SELECT count(*) FROM users),
            'domains_total', (SELECT count(*) FROM domains),
            'links_owned', (SELECT count(*) FROM links WHERE user_id IS NOT NULL),
            'links_anonymous', (SELECT count(*) FROM links WHERE user_id IS NULL),
            'links_banned', (SELECT count(*) FROM links WHERE banned),
            'api_keys_present', (SELECT count(*) FROM users WHERE apikey IS NOT NULL AND apikey <> ''),
            'visits_rows', (SELECT count(*) FROM visits),
            'visit_total', (SELECT COALESCE(sum(total),0) FROM visits)
          );
          SQL
