name: Handoff preflight

on:
  pull_request:
    paths:
      - '.github/workflows/handoff-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    environment: CLOUDFLARE
    runs-on: [self-hosted, Linux, ARM64, link]
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: 54a91f1020fb773dad8aa0b3a70f93b4
      CF_ZONE: f7a6f999430cb1a801d5259f6c437c53
    steps:
      - name: Verify handoff inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CF_TOKEN:-}" ]] || { echo "CLOUDFLARE_API_TOKEN repository secret is missing"; exit 1; }
          echo "Environment secret boundary: PASS"

      - name: Verify Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          verify() {
            local url=$1
            local code
            code=$(curl --silent --show-error -o "$body" -w '%{http_code}' \
              -H "Authorization: Bearer $CF_TOKEN" "$url")
            [[ "$code" == 200 ]] || return 1
            python3 -c 'import json,sys; x=json.load(open(sys.argv[1], encoding="utf-8")); assert x.get("success") is True; assert x.get("result",{}).get("status") == "active"' "$body"
          }
          if verify https://api.cloudflare.com/client/v4/user/tokens/verify; then
            echo "Cloudflare user-owned token active: PASS"
          elif verify "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/tokens/verify"; then
            echo "Cloudflare account-owned token active: PASS"
          else
            echo "Cloudflare token verification failed for both user-owned and account-owned token endpoints" >&2
            exit 1
          fi

      - name: Verify Workers account access
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts" \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x.get("success") is True'
          echo "Workers API access: PASS"

      - name: Verify Workers route access
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/workers/routes" \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x.get("success") is True'
          echo "Workers route API access: PASS"

      - name: Verify D1 account access
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/d1/database" \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x.get("success") is True'
          echo "D1 API access: PASS"

