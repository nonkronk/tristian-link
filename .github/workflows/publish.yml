name: Publish theme artifact

on:
  push:
    branches: [main]
    paths:
      - 'custom/**'
      - 'compatibility/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-theme
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Validate before publish
        run: |
          bash test/theme.sh
          bash test/upstream.sh
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable artifact
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tristian-link-theme:main
            ghcr.io/${{ github.repository_owner }}/tristian-link-theme:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - name: Build and publish native ARM64 production artifact
        id: arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tristian-link-theme:production-arm64
            ghcr.io/${{ github.repository_owner }}/tristian-link-theme:production-arm64-sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.tristian.link.role=production-arm64
          provenance: false
          sbom: false
      - name: Publish summary
        run: |
          {
            echo '### Tristian Link theme published'
            echo
            echo 'Portable multi-arch artifact:'
            echo '`ghcr.io/${{ github.repository_owner }}/tristian-link-theme:main@${{ steps.build.outputs.digest }}`'
            echo
            echo 'OCI production ARM64 artifact:'
            echo '`ghcr.io/${{ github.repository_owner }}/tristian-link-theme:production-arm64@${{ steps.arm64.outputs.digest }}`'
          } >> "$GITHUB_STEP_SUMMARY"
