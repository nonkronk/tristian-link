name: Deploy serverless production

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'migrations/**'
      - 'wrangler.jsonc'
      - '.github/workflows/serverless-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tristian-link-serverless-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, link]
    environment: CLOUDFLARE
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 54a91f1020fb773dad8aa0b3a70f93b4
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply D1 migrations
        run: npx --yes wrangler@4.145.0 d1 migrations apply DB --remote --config wrangler.jsonc
      - name: Deploy production Worker
        run: npx --yes wrangler@4.145.0 deploy --config wrangler.jsonc
      - name: Verify production Worker settings
        shell: bash
        run: |
          set -euo pipefail
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/tristian-link/settings" > "$body"
          python3 - "$body" <<'PY'
import json,sys
x=json.load(open(sys.argv[1],encoding='utf-8'))
assert x.get('success') is True
r=x['result']
bindings=r.get('bindings',[])
names={b.get('name') for b in bindings}
assert 'DB' in names
PY
          echo "Hidden production Worker: PASS"
