name: Deploy serverless production

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'migrations/**'
      - 'wrangler.jsonc'
      - '.github/workflows/serverless-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tristian-link-serverless-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, link]
    environment: CLOUDFLARE
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 54a91f1020fb773dad8aa0b3a70f93b4
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply D1 migrations
        run: npx --yes wrangler@4.145.0 d1 migrations apply DB --remote --config wrangler.jsonc
      - name: Deploy production Worker
        run: npx --yes wrangler@4.145.0 deploy --config wrangler.jsonc
      - name: Ensure stable link-password pepper
        shell: bash
        run: |
          set -euo pipefail
          out=$(mktemp)
          trap 'rm -f "$out"' EXIT
          npx --yes wrangler@4.145.0 secret list --config wrangler.jsonc > "$out"
          if grep -q 'LINK_PASSWORD_PEPPER' "$out"; then
            echo "LINK_PASSWORD_PEPPER already exists; preserving it"
          else
            secret=$(python3 -c 'import secrets; print(secrets.token_hex(32))')
            printf '%s' "$secret" | npx --yes wrangler@4.145.0 secret put LINK_PASSWORD_PEPPER --config wrangler.jsonc >/dev/null
            unset secret
            echo "LINK_PASSWORD_PEPPER created"
          fi
      - name: Verify production Worker settings
        shell: bash
        run: |
          set -euo pipefail
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/tristian-link/settings" > "$body"
          python3 -c 'import json,sys; x=json.load(open(sys.argv[1],encoding="utf-8")); assert x.get("success") is True; r=x["result"]; names={b.get("name") for b in r.get("bindings",[])}; assert "DB" in names' "$body"
          npx --yes wrangler@4.145.0 secret list --config wrangler.jsonc | grep -q 'LINK_PASSWORD_PEPPER'
          echo "Production Worker deployment: PASS"
