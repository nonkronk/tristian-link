name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate serverless application
        run: |
          set -euo pipefail
          node --check src/worker.js
          node --check src/links.js
          node --check src/util.js
          node --check public/app.js
          node --check public/admin/admin.js
          node test/serverless.test.mjs
          python3 -m py_compile scripts/kutt-to-d1.py scripts/reconcile-access.py
          grep -qF 'data-tristian-link-theme="zenburn"' public/index.html
          grep -qF 'Make long links' public/index.html
          grep -qF '"database_id": "61153ad9-0896-4271-acb4-e4bb8679cc09"' wrangler.jsonc
          grep -qF '"__D1_DATABASE_ID__"' wrangler.preview.jsonc
      - name: Validate legacy Kutt fallback layer
        run: bash test/theme.sh
      - name: Verify against exact upstream Kutt image
        run: bash test/upstream.sh
      - name: Verify artifact image shape
        run: |
          set -euo pipefail
          docker build -t tristian-link-theme:test .
          cid=$(docker create tristian-link-theme:test /does-not-run)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/custom" "$RUNNER_TEMP/custom"
          docker cp "$cid:/compatibility" "$RUNNER_TEMP/compatibility"
          diff -qr custom "$RUNNER_TEMP/custom"
          diff -qr compatibility "$RUNNER_TEMP/compatibility"
