<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000010">
  <title>log in | link.tristian.id</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/admin/login/login.js"></script>
</head>
<body>
  <div class="main-wrapper">
    <header class="tl-header" data-tristian-link-theme="zenburn">
      <a class="tl-brand" href="/"><span class="tl-prompt">❯</span><span>link</span><span class="tl-cursor"></span></a>
    </header>
    <main class="tl-page">
      <div class="tl-command"><span class="tl-prompt">❯</span> authenticate</div>
      <h1>Admin login</h1>
      <p>Use the same account credentials you used with Kutt.</p>
      <form id="login-signup" autocomplete="on">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" value="irvan@tristian.id" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p id="login-error" class="error" hidden></p>
        <button class="primary" type="submit">log in ↵</button>
      </form>
      <p><a href="/">← back to shorten</a></p>
    </main>
  </div>
</body>
</html>
